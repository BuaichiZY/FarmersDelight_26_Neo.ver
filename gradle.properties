# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.paths=work/jdk-25

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.0-beta
neo_version_range=[26.3.0.0-beta,)
loader_version_range=[1,)

# Mod Info
mod_version=1.3.3
mod_id=farmersdelight
mod_name=Farmer's Delight
mod_license=MIT License
mod_authors=vectorwing
mod_description=A cozy farming and cooking expansion for Minecraft!

# Dependency Info
jei_minecraft=26.3
jei_version=31.0.0.5
jei_modrinth_version=F362eSDt
emi_version=1.1.22+1.21.1
appleskin_version=mc1.21-3.0.5
crafttweaker_minecraft=1.21
crafttweaker_version=20.0.21
crafttweaker_ap_version=3.0.0.15

# Optional legacy integrations remain disabled until 26.3 artifacts are available.
enable_optional_integrations=false
enable_data_generators=false
enable_jei_runtime=false
