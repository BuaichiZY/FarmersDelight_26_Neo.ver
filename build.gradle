import groovy.json.JsonOutput

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = 'vectorwing.farmersdelight' // http://maven.apache.org/guides/mini/guide-naming-conventions.html

repositories {
    maven {
        // Portable JEI runtime source; the upstream Maven may occasionally be unavailable.
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        // JEI
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // CraftTweaker
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven { url "https://maven.ryanliptak.com/" }
    maven {
        // EMI
        url = "https://maven.terraformersmc.com/"
    }
}

base {
    archivesName = 'FarmersDelight'
}

def sourcesJar = tasks.register('sourcesJar', Jar) {
    group = 'build'
    description = 'Packages the sources and authored resources for this port.'
    archiveFileName = "FarmersDelight-${minecraft_version}-${mod_version}_source.jar"
    from sourceSets.main.java
    from('src/main/resources')
    from('src/generated/resources') {
        exclude '.cache/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble').configure {
    dependsOn sourcesJar
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def java25Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable.set(java25Launcher.map { it.executablePath.asFile.absolutePath })
}

neoForge {
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Optional automated local-server connection for integration tests.
            if (providers.gradleProperty('quick_play_server').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument providers.gradleProperty('quick_play_server').get()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def generatedItemDefinitionsDir = layout.buildDirectory.dir('generated/item-definitions')

def generateItemDefinitions = tasks.register('generateItemDefinitions') {
    def legacyItemModels = fileTree('src/generated/resources/assets/farmersdelight/models/item') {
        include '**/*.json'
    }
    def authoredItemDefinitions = file('src/main/resources/assets/farmersdelight/items')

    inputs.files(legacyItemModels)
    inputs.dir(authoredItemDefinitions)
    outputs.dir(generatedItemDefinitionsDir)

    doLast {
        def outputRoot = generatedItemDefinitionsDir.get().asFile
        delete(outputRoot)

        legacyItemModels.files.sort { it.path }.each { modelFile ->
            def modelRoot = file('src/generated/resources/assets/farmersdelight/models/item')
            def relativePath = modelRoot.toPath().relativize(modelFile.toPath()).toString().replace('\\', '/')
            if (new File(authoredItemDefinitions, relativePath).exists()) {
                return
            }

            def itemId = relativePath.substring(0, relativePath.length() - '.json'.length())
            def outputFile = new File(outputRoot, "assets/${mod_id}/items/${relativePath}")
            outputFile.parentFile.mkdirs()
            def definition = [model: [type: 'minecraft:model', model: "${mod_id}:item/${itemId}"]]
            outputFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(definition)) + System.lineSeparator(), 'UTF-8')
        }
    }
}

sourceSets.main.resources {
    exclude(".cache")
    srcDir 'src/generated/resources'
    srcDir generatedItemDefinitionsDir
}

tasks.named('processResources').configure {
    dependsOn generateItemDefinitions
}

def enableOptionalIntegrations = providers.gradleProperty('enable_optional_integrations')
        .map { it.toBoolean() }
        .getOrElse(false)
def enableDataGenerators = providers.gradleProperty('enable_data_generators')
        .map { it.toBoolean() }
        .getOrElse(false)

sourceSets.main.java {
    if (!enableOptionalIntegrations) {
        exclude 'vectorwing/farmersdelight/integration/crafttweaker/**'
        exclude 'vectorwing/farmersdelight/integration/emi/**'
    }
    if (!enableDataGenerators) {
        exclude 'vectorwing/farmersdelight/data/**'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Compile against and test with the official 26.1.2 JEI artifact.
    // JEI remains optional for the distributed Farmer's Delight jar.
    def jeiDependency = "maven.modrinth:jei:${jei_modrinth_version}"
    compileOnly jeiDependency
    localRuntime jeiDependency

    if (enableOptionalIntegrations) {
        // These coordinates target the upstream 1.21 branch and remain disabled
        // until each integration publishes and is migrated for Minecraft 26.1.2.
        compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
        compileOnly "squeek.appleskin:appleskin-neoforge:${appleskin_version}:api"

        def ctDep = "com.blamejared.crafttweaker:CraftTweaker-neoforge-${crafttweaker_minecraft}:${crafttweaker_version}"
        compileOnly ctDep
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

